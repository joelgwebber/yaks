[workspace]
# `.edtui` is a local, gitignored working clone of the forked edtui repo (for
# developing upstream PRs); it is its own repo/workspace, not a yaks member.
exclude = [".edtui"]

[package]
name = "yaks"
version = "0.0.13"
edition = "2024"
description = "Filesystem-native task tracker: a fast single-binary CLI + TUI over markdown task files"
license = "Apache-2.0"
repository = "https://github.com/joelgwebber/yaks"
default-run = "yaks"

[[bin]]
name = "yaks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = { version = "1", features = ["preserve_order"] }
ratatui = "0.30"
# Our fork, consuming the `yaks-integration` branch (r / counts / W-B-E, plus
# more as we add it). CI fetches this from GitHub; the local ./.edtui checkout is
# just where those branches are authored. Cargo.lock pins the exact commit.
edtui = { git = "https://github.com/joelgwebber/edtui", branch = "yaks-integration", default-features = false, features = ["arboard"] }
# Headless ratatui driver, extracted from yaks into its own repo. Not on
# crates.io yet; Cargo.lock pins the exact commit.
toque = { git = "https://github.com/joelgwebber/toque", branch = "main" }
notify = "6"
arboard = { version = "3", features = ["wayland-data-control"] }
png = "0.17"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2"
insta = "1"
