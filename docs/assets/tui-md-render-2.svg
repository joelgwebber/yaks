<text y="23.5"><tspan x="10.0" class="s0"> 🦬</tspan><tspan x="35.2" class="s0"> Hairy (1)</tspan><tspan x="136.0" class="s1"> 🪒</tspan><tspan x="161.2" class="s1"> Shaving (0)</tspan><tspan x="278.8" class="s1"> 🐑</tspan><tspan x="304.0" class="s1"> Shorn (0)</tspan><tspan x="404.8" class="s1"> 🕒</tspan><tspan x="430.0" class="s1"> Recent (1)</tspan><tspan x="539.2" class="s1"> ⭐</tspan><tspan x="564.4" class="s1"> Starred (0)</tspan><tspan x="682.0" class="s1"> 🛖</tspan><tspan x="707.2" class="s1"> Sheds (…)</tspan></text>
<text y="59.5"><tspan x="10.0" class="s2">◂</tspan><tspan x="35.2">🦬</tspan><tspan x="60.4" class="s3">yaks-ea13</tspan><tspan x="152.8" class="s2">task</tspan><tspan x="228.4" class="s4">p3</tspan><tspan x="262.0" class="s5">Markdown rendering improvements</tspan></text>
<text y="77.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">───────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text y="95.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="113.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s2">1.</tspan><tspan x="52.0">And the same with bulleted lists that also have very long lines that would otherwise wrap to the first</tspan></text>
<text y="131.5"><tspan x="10.0" class="s2">│</tspan><tspan x="52.0">column.</tspan></text>
<text y="149.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s2">2.</tspan><tspan x="52.0">Like this, which is very ugly and difficult to read in large lists.</tspan></text>
<text y="167.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="185.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">───────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text y="203.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="221.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">HRs should really render as actual horizontal rules and not just three hyphens.</tspan></text>
<text y="239.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="257.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s7">Much liks lists, it would be great if comments also rendered and wrapped in such a way that the</tspan></text>
<text y="275.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s7">indendentation was clear.</tspan></text>
<text y="293.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="311.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s8">Another case:</tspan></text>
<text y="329.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan></text>
<text y="347.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s7">It would also be nice if comment blocks rendered properly with nested markup, so blocks like this don't</tspan></text>
<text y="365.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s7">turn into an unending sea of gray.</tspan></text>
<text y="383.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan></text>
<text y="401.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎ python</tspan></text>
<text y="419.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s9"># with unformatted code</tspan></text>
<text y="437.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan></text>
<text y="455.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s7">And lists that look like</tspan></text>
<text y="473.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan></text>
<text y="491.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s2">•</tspan><tspan x="60.4" class="s7">still</tspan></text>
<text y="509.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s2">•</tspan><tspan x="60.4" class="s7">more</tspan></text>
<text y="527.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">▎</tspan><tspan x="43.6" class="s2">•</tspan><tspan x="60.4" class="s7">gray</tspan></text>
<text y="545.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="563.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s10">We also need different</tspan></text>
<text y="581.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="599.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s11">Treatment for each kind</tspan></text>
<text y="617.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="635.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s12">of header</tspan></text>
<text y="653.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="671.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">It would also be nice if long lines rendered naturally as a paragraph when they wrap past the last column</tspan></text>
<text y="689.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">in the viewport. But it would also be nice if paragraphs that had been auto-wrapped by an editor or an</tspan></text>
<text y="707.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">agent that got overzealous about formatting everything fastidiously.</tspan></text>
<text y="725.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="743.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">I believe it's the markdown norm to only consider paragraph breaks with a newline. But that's also worth</tspan></text>
<text y="761.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">double-checking.</tspan></text>
<text y="779.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="797.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">java</tspan></text>
<text y="815.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s9">// Some languages can be insanely verbose, so it would help if code didn't wrap within blocks.</tspan></text>
<text y="833.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s13">public</tspan><tspan x="85.6" class="s13">static</tspan><tspan x="144.4" class="s13">final</tspan><tspan x="194.8" class="s14">native verbose obscene repetitive sealed bespoke</tspan><tspan x="606.4" class="s13">class</tspan><tspan x="656.8" class="s3">WhyDoJavaAndCSharpProgrammersUs</tspan><tspan x="917.2" class="s6">›</tspan></text>
<text y="851.5"><tspan x="10.0" class="s2">│</tspan><tspan x="60.4">@</tspan><tspan x="68.8" class="s14">dependencyInjectionInsanity</tspan><tspan x="295.6">(</tspan><tspan x="304.0" class="s3">DoubleBuckyDjangoRheinhardtTool</tspan><tspan x="564.4">.</tspan><tspan x="572.8" class="s13">class</tspan><tspan x="614.8">)</tspan></text>
<text y="869.5"><tspan x="10.0" class="s2">│</tspan><tspan x="60.4" class="s13">public</tspan><tspan x="119.2" class="s13">static</tspan><tspan x="178.0" class="s13">final</tspan><tspan x="228.4" class="s14">sealed</tspan><tspan x="287.2" class="s13">void</tspan><tspan x="329.2" class="s14">dynamic withEvenMoreWeirdlyNamedMethods</tspan><tspan x="656.8">()</tspan><tspan x="682.0">{</tspan></text>
<text y="887.5"><tspan x="10.0" class="s2">│</tspan><tspan x="94.0" class="s9">// ...</tspan></text>
<text y="905.5"><tspan x="10.0" class="s2">│</tspan><tspan x="60.4">}</tspan></text>
<text y="923.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">}</tspan></text>
<text y="941.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="959.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s5">Markdown</tspan><tspan x="102.4" class="s6">│</tspan><tspan x="119.2" class="s5">Tables</tspan><tspan x="178.0" class="s6">│</tspan><tspan x="194.8" class="s5">Can</tspan><tspan x="270.4" class="s6">│</tspan><tspan x="287.2" class="s5">Be</tspan><tspan x="362.8" class="s6">│</tspan><tspan x="379.6" class="s5">Really</tspan><tspan x="438.4" class="s6">│</tspan><tspan x="455.2" class="s5">useful</tspan></text>
<text y="977.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s6">─────────┼────────┼──────────┼──────────┼────────┼───────</tspan></text>
<text y="995.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">But</tspan><tspan x="102.4" class="s6">│</tspan><tspan x="119.2">My</tspan><tspan x="178.0" class="s6">│</tspan><tspan x="194.8">God</tspan><tspan x="270.4" class="s6">│</tspan><tspan x="287.2">They</tspan><tspan x="362.8" class="s6">│</tspan><tspan x="379.6">Can</tspan><tspan x="438.4" class="s6">│</tspan><tspan x="455.2">Be</tspan></text>
<text y="1013.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Such</tspan><tspan x="102.4" class="s6">│</tspan><tspan x="119.2">An</tspan><tspan x="178.0" class="s6">│</tspan><tspan x="194.8">Absolute</tspan><tspan x="270.4" class="s6">│</tspan><tspan x="287.2">Bitch</tspan><tspan x="362.8" class="s6">│</tspan><tspan x="379.6">To</tspan><tspan x="438.4" class="s6">│</tspan></text>
<text y="1031.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Read</tspan><tspan x="102.4" class="s6">│</tspan><tspan x="119.2">And</tspan><tspan x="178.0" class="s6">│</tspan><tspan x="194.8">Write</tspan><tspan x="270.4" class="s6">│</tspan><tspan x="287.2">Reliably</tspan><tspan x="362.8" class="s6">│</tspan><tspan x="379.6">Like</tspan><tspan x="438.4" class="s6">│</tspan><tspan x="455.2">This</tspan></text>
<text y="1049.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="1067.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">We should at least</tspan><tspan x="186.4" class="s7">render</tspan><tspan x="245.2">tables cleanly, even if we don't have great editing tools yet.</tspan></text>
<text y="1085.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="1103.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s2">▸ joel · Sunday 11:00 UTC</tspan><tspan x="245.2" class="s6">─────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text y="1121.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Any thing else you can think of in the markdown standard (such as it is) and common extensions?</tspan></text>
<text y="1139.5"><tspan x="10.0" class="s2">│</tspan></text>
