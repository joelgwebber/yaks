<text y="329.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Seen on staging too. The refresh path never runs when the token is already expired.</tspan></text>
<text y="347.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="365.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s2">▸ agent-1 · Sunday 11:58 UTC</tspan><tspan x="270.4" class="s6">────────────────────────────────────────────────────────────────</tspan></text>
<text y="383.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Root cause:</tspan><tspan x="127.6" class="s8">refresh()</tspan><tspan x="211.6">checks</tspan><tspan x="270.4" class="s8">exp</tspan><tspan x="304.0">after the request, not before.</tspan></text>
