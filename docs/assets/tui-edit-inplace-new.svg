<text y="185.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8">Logging in with an expired token crashes the app.</tspan></text>
<text y="203.5"><tspan x="10.0" class="s2">│</tspan></text>
<text y="221.5"><tspan x="10.0" class="s2">│</tspan><tspan x="26.8" class="s7">Repro</tspan></text>
