<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaks Board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root {
  --pico-font-size: 14px;
}
body { margin: 0; padding: 0; }

header.repo-bar {
  background: var(--pico-primary-background);
  color: var(--pico-primary-inverse);
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
header.repo-bar h1 {
  margin: 0;
  font-size: 1.1rem;
  white-space: nowrap;
}
header.repo-bar form {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  margin: 0;
  flex: 1;
}
header.repo-bar input {
  margin: 0;
  padding: 0.3rem 0.6rem;
  font-size: 0.9rem;
  max-width: 300px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: inherit;
  border-radius: 4px;
}
header.repo-bar input::placeholder { color: rgba(255,255,255,0.6); }
header.repo-bar button {
  margin: 0;
  padding: 0.3rem 0.8rem;
  font-size: 0.85rem;
  white-space: nowrap;
}
header.repo-bar select {
  margin: 0;
  padding: 0.3rem 0.5rem;
  font-size: 0.85rem;
  max-width: 200px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: inherit;
  border-radius: 4px;
}
header.repo-bar select option { color: #333; }

.status-bar {
  padding: 0.4rem 1.25rem;
  font-size: 0.8rem;
  color: var(--pico-muted-color);
  border-bottom: 1px solid var(--pico-muted-border-color);
}
.status-bar.error { color: var(--pico-del-color); }

.board {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1rem;
  padding: 1rem 1.25rem;
  min-height: calc(100vh - 120px);
  align-items: start;
}

.column {
  background: var(--pico-card-background-color);
  border: 1px solid var(--pico-muted-border-color);
  border-radius: 8px;
  overflow: hidden;
}
.column-header {
  padding: 0.6rem 0.8rem;
  font-weight: 600;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--pico-muted-border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.column-header .count {
  background: var(--pico-muted-border-color);
  border-radius: 10px;
  padding: 0.1rem 0.5rem;
  font-size: 0.75rem;
  font-weight: normal;
}
.column-body {
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.card {
  border: 1px solid var(--pico-muted-border-color);
  border-radius: 6px;
  padding: 0.6rem 0.75rem;
  cursor: pointer;
  transition: box-shadow 0.15s;
  background: var(--pico-background-color);
}
.card:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.card-top {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.25rem;
}
.card-id {
  font-family: var(--pico-font-family-monospace);
  font-size: 0.75rem;
  color: var(--pico-muted-color);
}
.card-title {
  font-weight: 500;
  font-size: 0.9rem;
  line-height: 1.3;
}
.card-meta {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-top: 0.35rem;
}

.badge {
  font-size: 0.7rem;
  padding: 0.05rem 0.4rem;
  border-radius: 3px;
  font-weight: 500;
}
.badge-p1 { background: #fee2e2; color: #991b1b; }
.badge-p2 { background: #fef3c7; color: #92400e; }
.badge-p3 { background: #e0e7ff; color: #3730a3; }
.badge-bug { background: #fecaca; color: #991b1b; }
.badge-feature { background: #d1fae5; color: #065f46; }
.badge-task { background: #e0e7ff; color: #3730a3; }
.badge-idea { background: #f3e8ff; color: #6b21a8; }
.badge-label {
  background: var(--pico-muted-border-color);
  color: var(--pico-color);
}
.badge-dep {
  background: #fef3c7;
  color: #92400e;
  font-size: 0.65rem;
}
.badge-child {
  background: var(--pico-muted-border-color);
  color: var(--pico-muted-color);
  font-size: 0.65rem;
}

.card-children {
  margin-top: 0.4rem;
  padding-left: 0.6rem;
  border-left: 2px solid var(--pico-muted-border-color);
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.child-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.8rem;
  padding: 0.2rem 0;
  cursor: pointer;
}
.child-row:hover { text-decoration: underline; }
.child-row .card-id { font-size: 0.7rem; }
.child-status {
  font-size: 0.7rem;
  width: 1.2em;
  text-align: center;
}

/* Expanded card / modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  justify-content: center;
  align-items: start;
  padding: 3rem 1rem;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-content {
  background: var(--pico-background-color);
  border-radius: 10px;
  max-width: 700px;
  width: 100%;
  padding: 1.5rem;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}
.modal-content h2 {
  margin-top: 0;
  font-size: 1.2rem;
}
.modal-meta {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.modal-field {
  font-size: 0.85rem;
  margin-bottom: 0.3rem;
  color: var(--pico-muted-color);
}
.modal-field strong { color: var(--pico-color); }
.modal-body {
  border-top: 1px solid var(--pico-muted-border-color);
  padding-top: 0.8rem;
  font-size: 0.9rem;
  line-height: 1.6;
}
.modal-body h1, .modal-body h2, .modal-body h3 {
  font-size: 1rem;
  margin-top: 1rem;
}
.modal-close {
  float: right;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 1.3rem;
  color: var(--pico-muted-color);
  padding: 0;
  margin: 0;
  line-height: 1;
}

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--pico-muted-color);
}
.empty-state h2 { color: var(--pico-muted-color); }

.loading {
  text-align: center;
  padding: 2rem;
  color: var(--pico-muted-color);
}
.loading::after {
  content: "";
  display: inline-block;
  width: 1em;
  height: 1em;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-left: 0.5rem;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .board {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header class="repo-bar">
  <h1>Yaks</h1>
  <form id="repo-form">
    <input id="repo-input" type="text" placeholder="owner/repo" autocomplete="off">
    <select id="branch-select" style="display:none"></select>
    <button type="submit">Load</button>
  </form>
</header>

<div id="status-bar" class="status-bar" style="display:none"></div>

<div id="empty-state" class="empty-state">
  <h2>Yak Board</h2>
  <p>Enter a GitHub repository above to view its yak board.</p>
  <p style="font-size: 0.85rem">The repo must have a <code>.yaks/</code> directory at its root.</p>
</div>

<div id="board" class="board" style="display:none">
  <div class="column">
    <div class="column-header">Hairy <span id="count-hairy" class="count">0</span></div>
    <div id="col-hairy" class="column-body"></div>
  </div>
  <div class="column">
    <div class="column-header">Shaving <span id="count-shaving" class="count">0</span></div>
    <div id="col-shaving" class="column-body"></div>
  </div>
  <div class="column">
    <div class="column-header">Shorn <span id="count-shorn" class="count">0</span></div>
    <div id="col-shorn" class="column-body"></div>
  </div>
</div>

<div id="modal" class="modal-overlay">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
const STATUSES = ["hairy", "shaving", "shorn"];
const STATUS_EMOJI = { hairy: "\u{1F9AC}", shaving: "\u2702\uFE0F", shorn: "\u{1F411}", dead: "\u{1F480}" };
const TYPE_LABELS = { bug: "bug", feature: "feature", task: "task", idea: "idea" };

let state = { owner: "", repo: "", branch: "", tasks: [], taskMap: {} };

// --- URL hash ---
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return null;
  const parts = h.split("/");
  if (parts.length < 2) return null;
  return { owner: parts[0], repo: parts[1], branch: parts[2] || "" };
}

function writeHash(owner, repo, branch) {
  const h = branch ? `${owner}/${repo}/${branch}` : `${owner}/${repo}`;
  if (location.hash !== "#" + h) location.hash = h;
}

// --- GitHub API ---
async function apiFetch(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`GitHub API ${resp.status}: ${resp.statusText}`);
  return resp.json();
}

async function fetchBranches(owner, repo) {
  try {
    const data = await apiFetch(`https://api.github.com/repos/${owner}/${repo}/branches?per_page=100`);
    return data.map(b => b.name);
  } catch {
    return [];
  }
}

async function fetchTree(owner, repo, branch) {
  const data = await apiFetch(
    `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`
  );
  return data.tree || [];
}

async function fetchRaw(owner, repo, branch, path) {
  const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
  const resp = await fetch(url);
  if (!resp.ok) return null;
  return resp.text();
}

// --- Parsing ---
function parseFrontmatter(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: text };
  try {
    const meta = jsyaml.load(m[1]) || {};
    return { meta, body: m[2] };
  } catch {
    return { meta: {}, body: text };
  }
}

function parentId(id) {
  const dot = id.lastIndexOf(".");
  return dot === -1 ? null : id.substring(0, dot);
}

// --- Data loading ---
async function loadBoard(owner, repo, branch) {
  state = { owner, repo, branch, tasks: [], taskMap: {} };
  showStatus("Loading...", false, true);

  const tree = await fetchTree(owner, repo, branch);
  const yakFiles = [];
  for (const entry of tree) {
    if (entry.type !== "blob") continue;
    const m = entry.path.match(/^\.yaks\/(hairy|shaving|shorn|dead)\/(.+\.md)$/);
    if (m) yakFiles.push({ status: m[1], path: entry.path });
  }

  if (yakFiles.length === 0) {
    showStatus("No .yaks/ tasks found in this repo/branch.", true);
    return;
  }

  showStatus(`Fetching ${yakFiles.length} tasks...`, false, true);

  const results = await Promise.all(
    yakFiles.map(async (f) => {
      const text = await fetchRaw(owner, repo, branch, f.path);
      if (!text) return null;
      const { meta, body } = parseFrontmatter(text);
      return { ...meta, _status: f.status, _body: body, _path: f.path };
    })
  );

  const tasks = results.filter(Boolean);
  const taskMap = {};
  for (const t of tasks) {
    if (t.id) taskMap[t.id] = t;
  }

  state.tasks = tasks;
  state.taskMap = taskMap;

  renderBoard();
  showStatus(`${tasks.length} tasks loaded.`, false);
}

// --- Rendering ---
function renderBoard() {
  const board = document.getElementById("board");
  const empty = document.getElementById("empty-state");
  board.style.display = "grid";
  empty.style.display = "none";

  for (const s of STATUSES) {
    const col = document.getElementById(`col-${s}`);
    col.innerHTML = "";
  }

  // Group: top-level tasks (no parent, or parent not in same status)
  const byStatus = { hairy: [], shaving: [], shorn: [] };
  const childrenOf = {};

  for (const t of state.tasks) {
    if (!STATUSES.includes(t._status)) continue;
    const pid = parentId(t.id);
    if (pid && state.taskMap[pid] && state.taskMap[pid]._status === t._status) {
      if (!childrenOf[pid]) childrenOf[pid] = [];
      childrenOf[pid].push(t);
    } else {
      byStatus[t._status].push(t);
    }
  }

  // Sort: priority asc, then id
  const sortFn = (a, b) => (a.priority || 9) - (b.priority || 9) || (a.id || "").localeCompare(b.id || "");

  for (const s of STATUSES) {
    const tasks = byStatus[s].sort(sortFn);
    document.getElementById(`count-${s}`).textContent = tasks.length;
    const col = document.getElementById(`col-${s}`);

    for (const t of tasks) {
      col.appendChild(renderCard(t, childrenOf));
    }
  }
}

function renderCard(t, childrenOf) {
  const card = document.createElement("div");
  card.className = "card";
  card.onclick = () => openModal(t);

  let html = `<div class="card-top">`;
  html += `<span class="card-id">${esc(t.id || "?")}</span>`;
  html += `</div>`;
  html += `<div class="card-title">${esc(t.title || "(untitled)")}</div>`;

  // Meta badges
  html += `<div class="card-meta">`;
  if (t.priority) html += `<span class="badge badge-p${t.priority}">P${t.priority}</span>`;
  if (t.type) html += `<span class="badge badge-${t.type}">${esc(t.type)}</span>`;
  if (t.labels && t.labels.length) {
    for (const l of t.labels) {
      html += `<span class="badge badge-label">${esc(l)}</span>`;
    }
  }
  if (t.depends_on && t.depends_on.length) {
    html += `<span class="badge badge-dep">${t.depends_on.length} dep${t.depends_on.length > 1 ? "s" : ""}</span>`;
  }
  html += `</div>`;

  // Children
  const children = (childrenOf[t.id] || []).sort(
    (a, b) => (a.id || "").localeCompare(b.id || "")
  );
  if (children.length) {
    html += `<div class="card-children">`;
    for (const c of children) {
      const emo = STATUS_EMOJI[c._status] || "";
      html += `<div class="child-row" data-id="${esc(c.id)}">`;
      html += `<span class="child-status">${emo}</span>`;
      html += `<span class="card-id">${esc(c.id)}</span>`;
      html += `<span>${esc(c.title || "")}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  card.innerHTML = html;

  // Wire up child row clicks
  for (const row of card.querySelectorAll(".child-row")) {
    row.onclick = (e) => {
      e.stopPropagation();
      const cid = row.dataset.id;
      if (state.taskMap[cid]) openModal(state.taskMap[cid]);
    };
  }

  return card;
}

function openModal(t) {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modal-content");

  let html = `<button class="modal-close" onclick="closeModal()">&times;</button>`;
  html += `<h2>${STATUS_EMOJI[t._status] || ""} ${esc(t.title || "(untitled)")}</h2>`;

  html += `<div class="modal-meta">`;
  html += `<span class="badge badge-p${t.priority || 3}">P${t.priority || "?"}</span>`;
  if (t.type) html += `<span class="badge badge-${t.type}">${esc(t.type)}</span>`;
  if (t.labels && t.labels.length) {
    for (const l of t.labels) html += `<span class="badge badge-label">${esc(l)}</span>`;
  }
  html += `</div>`;

  html += `<div class="modal-field"><strong>ID:</strong> <code>${esc(t.id || "?")}</code></div>`;
  html += `<div class="modal-field"><strong>Status:</strong> ${esc(t._status)}</div>`;
  if (t.created) html += `<div class="modal-field"><strong>Created:</strong> ${esc(String(t.created))}</div>`;
  if (t.updated) html += `<div class="modal-field"><strong>Updated:</strong> ${esc(String(t.updated))}</div>`;
  if (t.commit) html += `<div class="modal-field"><strong>Commit:</strong> <code>${esc(t.commit)}</code></div>`;

  if (t.depends_on && t.depends_on.length) {
    html += `<div class="modal-field"><strong>Depends on:</strong> `;
    html += t.depends_on.map(d => {
      const dep = state.taskMap[d];
      const emo = dep ? (STATUS_EMOJI[dep._status] || "") : "";
      return `<code class="dep-link" data-id="${esc(d)}" style="cursor:pointer">${emo} ${esc(d)}</code>`;
    }).join(", ");
    html += `</div>`;
  }

  // Parent
  const pid = parentId(t.id);
  if (pid && state.taskMap[pid]) {
    html += `<div class="modal-field"><strong>Parent:</strong> `;
    html += `<code class="dep-link" data-id="${esc(pid)}" style="cursor:pointer">${esc(pid)} ${esc(state.taskMap[pid].title || "")}</code>`;
    html += `</div>`;
  }

  // Children across all statuses
  const children = state.tasks.filter(c => parentId(c.id) === t.id);
  if (children.length) {
    html += `<div class="modal-field"><strong>Children:</strong></div>`;
    for (const c of children) {
      const emo = STATUS_EMOJI[c._status] || "";
      html += `<div class="modal-field" style="padding-left:1rem">`;
      html += `<code class="dep-link" data-id="${esc(c.id)}" style="cursor:pointer">${emo} ${esc(c.id)}</code> ${esc(c.title || "")}`;
      html += `</div>`;
    }
  }

  if (t._body && t._body.trim()) {
    html += `<div class="modal-body">${marked.parse(t._body)}</div>`;
  }

  content.innerHTML = html;

  // Wire up dep/parent/child links
  for (const link of content.querySelectorAll(".dep-link")) {
    link.onclick = (e) => {
      e.stopPropagation();
      const id = link.dataset.id;
      if (state.taskMap[id]) openModal(state.taskMap[id]);
    };
  }

  modal.classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

// --- UI helpers ---
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function showStatus(msg, isError, isLoading) {
  const bar = document.getElementById("status-bar");
  bar.style.display = "block";
  bar.className = "status-bar" + (isError ? " error" : "");
  bar.innerHTML = isLoading ? `<span class="loading">${esc(msg)}</span>` : esc(msg);
}

function hideStatus() {
  document.getElementById("status-bar").style.display = "none";
}

// --- Branch picker ---
async function setupBranches(owner, repo, currentBranch) {
  const sel = document.getElementById("branch-select");
  const branches = await fetchBranches(owner, repo);
  if (branches.length === 0) {
    sel.style.display = "none";
    return;
  }
  sel.innerHTML = "";
  for (const b of branches) {
    const opt = document.createElement("option");
    opt.value = b;
    opt.textContent = b;
    if (b === currentBranch) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.style.display = "";
  sel.onchange = () => {
    const b = sel.value;
    writeHash(owner, repo, b);
    loadBoard(owner, repo, b).catch(e => showStatus(e.message, true));
  };
}

// --- Init ---
document.getElementById("repo-form").onsubmit = async (e) => {
  e.preventDefault();
  const val = document.getElementById("repo-input").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
  const parts = val.split("/");
  if (parts.length < 2) {
    showStatus("Enter a repo as owner/repo", true);
    return;
  }
  const [owner, repo] = parts;
  writeHash(owner, repo, "");
  await boot(owner, repo, "");
};

async function boot(owner, repo, branch) {
  document.getElementById("repo-input").value = `${owner}/${repo}`;
  try {
    if (!branch) {
      const data = await apiFetch(`https://api.github.com/repos/${owner}/${repo}`);
      branch = data.default_branch || "main";
    }
    state.branch = branch;
    writeHash(owner, repo, branch);
    setupBranches(owner, repo, branch);
    await loadBoard(owner, repo, branch);
  } catch (e) {
    showStatus(e.message, true);
  }
}

// Modal: close on overlay click or Escape
document.getElementById("modal").onclick = (e) => {
  if (e.target === document.getElementById("modal")) closeModal();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

// Boot from hash
window.addEventListener("hashchange", () => {
  const h = readHash();
  if (h) boot(h.owner, h.repo, h.branch);
});

const initial = readHash();
if (initial) boot(initial.owner, initial.repo, initial.branch);
</script>
</body>
</html>
