[project]
name = "yaks"
version = "0.1.0"
description = "Filesystem-native task tracker"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
yaks = "yaklib.cli:main"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=8.0",
]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools]
py-modules = ["yak", "tui"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
